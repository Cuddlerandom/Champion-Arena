for(const p of shots){const f=clamp(p.life/p.flight,0,1),x=p.sx+(p.target.x-p.sx)*f,y=p.sy+(p.target.y-p.sy)*f;circle(x,y,9,p.team?'#ff8c8c':'#79caff');circle(x,y,4,'#ffffff')}for(const e of bursts){ctx.globalAlpha=clamp(e.life/.36,0,1)*.7;circle(e.x,e.y,e.size*(1.4-e.life*.3),e.team?'#ff9d6e':'#8edcff');ctx.globalAlpha=1}ctx.restore();

function resize(){const rect=canvas.getBoundingClientRect();viewW=Math.max(1,rect.width);viewH=Math.max(1,rect.height);const scale=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(viewW*scale);canvas.height=Math.round(viewH*scale);ctx.setTransform(scale,0,0,scale,0,0);bounds()}
const touches=new Map();let pinch=0;
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,point(e));pinch=0});
canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;const old=touches.get(e.pointerId),p=point(e);if(touches.size===1){camera.x-=(p.x-old.x)/camera.z;camera.y-=(p.y-old.y)/camera.z}else if(touches.size===2){const values=[...touches.entries()];const other=values.find(v=>v[0]!==e.pointerId)[1];const before=Math.hypot(old.x-other.x,old.y-other.y);const after=Math.hypot(p.x-other.x,p.y-other.y);if(before>10)camera.z=clamp(camera.z*after/before,.3,2.2)}touches.set(e.pointerId,p);bounds()});
function end(e){const p=point(e),start=touches.get(e.pointerId);if(start&&touches.size===1&&Math.hypot(p.x-start.x,p.y-start.y)<12){const x=(p.x-viewW/2)/camera.z+camera.x,y=(p.y-viewH/2)/camera.z+camera.y;selectedTower=towers.find(t=>t.hp>0&&Math.hypot(t.x-x,t.y-y)<40)||null}touches.delete(e.pointerId);pinch=0}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('wheel',e=>{e.preventDefault();camera.z=clamp(camera.z*(e.deltaY>0?.9:1.1),.3,2.2);bounds()},{passive:false});
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){let remain=dt*speed;while(remain>0){const step=Math.min(.035,remain);tick(step);remain-=step}}draw();requestAnimationFrame(frame)}
document.getElementById('mode').addEventListener('change',setup);document.getElementById('reset').onclick=setup;document.getElementById('home').onclick=center;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶ Weiter':'⏸ Pause'};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);document.querySelectorAll('[data-speed]').forEach(v=>v.classList.toggle('active',v===b))});window.addEventListener('resize',resize);resize();setup();requestAnimationFrame(frame);
</script></body></html>
