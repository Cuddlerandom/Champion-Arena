<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101b26"><title>Champion Arena V01.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1420;color:#e9f3f7;font:13px system-ui,sans-serif}body{display:flex;flex-direction:column}header{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:3px max(10px,env(safe-area-inset-right)) 3px max(10px,env(safe-area-inset-left));background:#142335;gap:8px}strong{font-size:15px}#score{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}#viewport{position:relative;flex:1;min-height:0;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;background:#263e35}#notice{position:absolute;left:50%;top:12px;transform:translateX(-50%);pointer-events:none;background:#101a29e8;padding:8px 15px;border-radius:10px;display:none;font-weight:bold;white-space:nowrap}#toolbar{display:flex;align-items:center;gap:5px;padding:5px max(8px,env(safe-area-inset-right)) 5px max(8px,env(safe-area-inset-left));background:#142335;overflow-x:auto;flex:none;scrollbar-width:none}button,select{border:1px solid #47617b;background:#243e58;color:#f0f5ff;padding:8px 10px;border-radius:8px;font:12px system-ui;white-space:nowrap;flex:none}button.active{background:#327eaf;border-color:#88c6ff}select{max-width:95px}#hint{position:absolute;bottom:8px;left:10px;background:#0d1c27aa;padding:4px 7px;border-radius:6px;pointer-events:none;font-size:11px} @media(orientation:portrait){#viewport:after{content:"↻ Querformat empfohlen";position:absolute;right:9px;top:9px;background:#0d1c27c9;padding:6px;border-radius:7px;pointer-events:none}} 
</style></head><body><header><strong>⚔️ Champion Arena <small>V01.2</small></strong><span id="score">🔵 100% · 00:00 · 🔴 100%</span></header><div id="viewport"><canvas id="game"></canvas><div id="notice"></div><div id="hint">☝ Ziehen: Kamera · ✌ Zoom</div></div><div id="toolbar"><select id="mode" aria-label="Arena"><option value="1">1v1 Duell</option><option value="3">3v3 Taktik</option><option value="5">5v5 Gross</option></select><button id="pause">⏸ Pause</button><button data-speed=".5">0,5×</button><button class="active" data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button><button data-speed="8">8×</button><button id="home">⌖ Mitte</button><button id="reset">↻ Neu</button></div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),score=document.getElementById('score'),notice=document.getElementById('notice');
const sizes={1:{w:1250,h:650,lane:165},3:{w:1900,h:950,lane:155},5:{w:2650,h:1320,lane:145}};
let mode=1,map=sizes[1],speed=1,paused=false,time=0,spawnIn=0,winner=null,units=[],towers=[],cores=[],shots=[],camera={x:625,y:325,z:1},viewW=1,viewH=1,last=performance.now(),id=0;
const color=['#6cbcff','#ff777c'],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function laneY(l){return map.h/2+(l-(mode===5?1:0))*(mode===5?map.h*.29:0)}
function pathY(team,l,x){if(mode===1)return map.h/2;if(mode===3){const mid=map.w/2;const blend=Math.sin(Math.PI*clamp(x/map.w,0,1));return map.h/2+(l===1?-1:l===2?1:0)*map.h*.29*blend}return laneY(l)}
function unit(team,type,l,x,y){const melee=type==='melee',caster=type==='caster',champ=type==='champ';const hp=champ?165:melee?75:caster?30:38;return{id:++id,team,type,l,x,y,hp,max:hp,armor:melee?5:caster?1:0,atk:champ?16:melee?5:caster?11:6,range:champ?73:melee?30:caster?125:32,cd:Math.random(),level:1,xp:0,gold:0,items:0,dead:0,kills:0,step:0}}
function setup(){mode=Number(document.getElementById('mode').value);map=sizes[mode];time=0;spawnIn=1;winner=null;units=[];towers=[];cores=[];shots=[];id=0;
for(let team=0;team<2;team++){const bx=team?map.w-75:75;cores.push({team,x:bx,y:map.h/2,hp:600,max:600,type:'core'});for(let i=0;i<2;i++){const x=team?map.w-300:300;const y=map.h/2+(i?95:-95);towers.push({team,x,y,hp:250,max:250,cd:0,aggro:null,type:'tower'});}
for(let i=0;i<mode;i++){const lane=mode===5?i%3:mode===3?i%3:0;const x=team?map.w-155:155;units.push(unit(team,'champ',lane,x,pathY(team,lane,x)+(i%2?22:-22)));}}
center();notice.style.display='none';}
function center(){camera.x=map.w/2;camera.y=map.h/2;camera.z=clamp(Math.min(viewW/(mode===1?800:1050),viewH/(mode===1?510:690)),.36,1.4);bounds()}
function bounds(){const hw=viewW/(2*camera.z),hh=viewH/(2*camera.z);camera.x=hw*2>=map.w?map.w/2:clamp(camera.x,hw,map.w-hw);camera.y=hh*2>=map.h?map.h/2:clamp(camera.y,hh,map.h-hh)}
function gain(u,xp,gold){if(u.type!=='champ')return;u.xp+=xp;u.gold+=gold;while(u.level<18&&u.xp>=u.level*35){u.xp-=u.level*35;u.level++;u.max+=16;u.hp+=16;u.atk+=2}if(u.gold>=110){u.gold-=110;u.items++;u.atk+=4;u.max+=15;u.hp+=15}}
function hit(a,b,damage){if(b.type==='core'&&towers.some(t=>t.team===b.team&&t.hp>0))return;b.hp=Math.max(0,b.hp-Math.max(1,damage-(b.armor||0)));shots.push({x:b.x,y:b.y,life:.25,team:a.team});if(b.type==='champ'&&a.type==='champ')for(const t of towers)if(t.team===b.team&&t.hp>0&&d(t,a)<170)t.aggro=a.id;
if(b.hp===0&&b.type==='champ'&&b.dead<=0){b.dead=7+b.level*2;gain(a,45,65);a.kills++}else if(b.hp===0&&(b.type==='minion'||b.type==='melee'||b.type==='caster')){gain(a,10,16)}else if(b.hp===0&&b.type==='tower'){gain(a,60,90)}}
function move(u,to,dt,rate){const distance=d(u,to);if(distance>1){const step=Math.min(distance,rate*dt);u.x+=(to.x-u.x)/distance*step;u.y+=(to.y-u.y)/distance*step}}
function tick(dt){if(winner!==null)return;time+=dt;spawnIn-=dt;if(spawnIn<=0){spawnIn+=8;for(let team=0;team<2;team++){const count=mode===5?3:mode===3?2:1;for(let lane=0;lane<count;lane++)for(let j=0;j<3;j++){const x=team?map.w-135-j*18:135+j*18;units.push(unit(team,mode===1?(j===2?'caster':'melee'):'minion',lane,x,pathY(team,lane,x)+(j-1)*17))}}}
for(const u of units){if(u.type==='champ'&&u.dead>0){u.dead-=dt;if(u.dead<=0){u.hp=u.max;u.x=u.team?map.w-155:155;u.y=pathY(u.team,u.l,u.x)}continue}if(u.hp<=0)continue;u.cd-=dt;
const foes=units.filter(v=>v.team!==u.team&&v.hp>0&&v.dead<=0);
const nearby=foes.filter(v=>d(u,v)<(u.type==='champ'?190:105)).sort((a,b)=>d(u,a)-d(u,b));
const enemyTowers=towers.filter(v=>v.team!==u.team&&v.hp>0).sort((a,b)=>d(u,a)-d(u,b));
const objective=enemyTowers[0]||cores[1-u.team];
let target=nearby[0]||objective;
if(u.type==='champ'&&u.hp/u.max<.23&&foes.some(v=>d(u,v)<185)){const bx=u.team?map.w-135:135;move(u,{x:bx,y:map.h/2},dt,105);if(d(u,{x:bx,y:map.h/2})<80)u.hp=Math.min(u.max,u.hp+22*dt);continue}
if(u.type!=='champ'&&!nearby.length){const destX=u.team?Math.max(70,u.x-110):Math.min(map.w-70,u.x+110);const route={x:destX,y:pathY(u.team,u.l,destX)};if(d(u,objective)<120)target=objective;else{move(u,route,dt,42);continue}}
if(u.type==='champ'&&target.type==='tower'&&d(u,target)<185){const alliedMinions=units.some(v=>v.team===u.team&&v.type!=='champ'&&v.hp>0&&d(v,target)<170);if(!alliedMinions){const stop={x:u.team?target.x-190:target.x+190,y:target.y};if(d(u,stop)>35)move(u,stop,dt,65);continue}}
const reach=u.range+(target.type==='core'?30:target.type==='tower'?20:0);
if(d(u,target)>reach)move(u,target,dt,u.type==='champ'?72:42);else if(u.cd<=0&&target.hp>0){u.cd=u.type==='champ'?.85:1.35;hit(u,target,u.atk)}
}
for(const tw of towers){if(tw.hp<=0)continue;tw.cd-=dt;if(tw.cd>0)continue;const inRange=units.filter(u=>u.team!==tw.team&&u.hp>0&&u.dead<=0&&d(u,tw)<170);let target=inRange.find(u=>u.id===tw.aggro)||inRange.filter(u=>u.type!=='champ').sort((a,b)=>d(a,tw)-d(b,tw))[0]||inRange[0];if(target){tw.cd=1.05;hit(tw,target,24)}else tw.aggro=null}
units=units.filter(u=>u.type==='champ'||u.hp>0);for(const e of shots)e.life-=dt;shots=shots.filter(e=>e.life>0);
for(const core of cores)if(core.hp<=0){winner=1-core.team;notice.textContent=(winner?'🔴 ROT':'🔵 BLAU')+' GEWINNT!';notice.style.display='block'}
}
function bar(x,y,w,h,p,fill){ctx.fillStyle='#10212a';ctx.fillRect(x,y,w,h);ctx.fillStyle=fill;ctx.fillRect(x,y,w*clamp(p,0,1),h)}
function circle(x,y,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function draw(){ctx.clearRect(0,0,viewW,viewH);ctx.fillStyle='#244136';ctx.fillRect(0,0,viewW,viewH);ctx.save();ctx.translate(viewW/2,viewH/2);ctx.scale(camera.z,camera.z);ctx.translate(-camera.x,-camera.y);
ctx.fillStyle='#a88a61';ctx.fillRect(0,0,map.w,map.h);
ctx.fillStyle='#c7aa79';ctx.fillRect(45,45,map.w-90,map.h-90);
ctx.strokeStyle='#98775155';ctx.lineWidth=2;for(let y=85;y<map.h-85;y+=70){ctx.beginPath();ctx.moveTo(70,y);ctx.lineTo(map.w-70,y);ctx.stroke()}for(let x=90;x<map.w-90;x+=110){ctx.beginPath();ctx.moveTo(x,65);ctx.lineTo(x,map.h-65);ctx.stroke()}
ctx.fillStyle='#51483c';ctx.fillRect(0,0,map.w,46);ctx.fillRect(0,map.h-46,map.w,46);
ctx.fillStyle='#7d6a52';ctx.fillRect(0,0,map.w,26);ctx.fillRect(0,map.h-46,map.w,26);
ctx.fillStyle='#e2c79a';for(let x=75;x<map.w;x+=110){ctx.fillRect(x-19,26,38,17);ctx.fillRect(x-19,map.h-46,38,17);ctx.fillStyle='#967b5a';ctx.fillRect(x-15,43,30,22);ctx.fillRect(x-15,map.h-68,30,22);ctx.fillStyle='#e2c79a'}
for(let team=0;team<2;team++){const bx=team?map.w-125:125;ctx.fillStyle=team?'#973f47':'#28699c';ctx.beginPath();ctx.moveTo(bx-48,28);ctx.lineTo(bx+48,28);ctx.lineTo(bx+35,100);ctx.lineTo(bx,83);ctx.lineTo(bx-35,100);ctx.closePath();ctx.fill();ctx.fillStyle='#e8d3a8';ctx.fillRect(bx-65,0,130,26)}
ctx.strokeStyle='#a2b8a047';ctx.lineWidth=2;for(let x=0;x<map.w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,map.h);ctx.stroke()}for(let y=0;y<map.h;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(map.w,y);ctx.stroke()}
ctx.strokeStyle='#b59a71';ctx.lineWidth=mode===1?180:mode===3?125:112;ctx.lineCap='round';ctx.lineJoin='round';
const routes=mode===5?[0,1,2]:mode===3?[0,1,2]:[0];for(const lane of routes){ctx.beginPath();for(let x=80;x<=map.w-80;x+=25){const y=pathY(0,lane,x);if(x===80)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()}
ctx.strokeStyle='#dfc99e';ctx.lineWidth=3;ctx.setLineDash([14,18]);for(const lane of routes){ctx.beginPath();for(let x=80;x<=map.w-80;x+=25){const y=pathY(0,lane,x);if(x===80)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()}ctx.setLineDash([]);
ctx.strokeStyle='#e6c676a0';ctx.lineWidth=3;ctx.setLineDash([14,12]);ctx.beginPath();ctx.moveTo(map.w/2,0);ctx.lineTo(map.w/2,map.h);ctx.stroke();ctx.setLineDash([]);
for(const core of cores){circle(core.x,core.y,37,color[core.team]);circle(core.x,core.y,23,'#dceeff');circle(core.x,core.y,13,color[core.team]);bar(core.x-43,core.y+44,86,8,core.hp/core.max,color[core.team]);if(towers.some(t=>t.team===core.team&&t.hp>0)){ctx.strokeStyle='#fff6';ctx.lineWidth=4;ctx.beginPath();ctx.arc(core.x,core.y,47,0,Math.PI*2);ctx.stroke()}}
for(const tw of towers){ctx.fillStyle='#5c5144';ctx.beginPath();ctx.moveTo(tw.x-19,tw.y-19);ctx.lineTo(tw.x-9,tw.y-33);ctx.lineTo(tw.x+29,tw.y-33);ctx.lineTo(tw.x+19,tw.y-19);ctx.closePath();ctx.fill();ctx.fillStyle=tw.hp>0?color[tw.team]:'#454c50';ctx.fillRect(tw.x-19,tw.y-19,38,38);ctx.strokeStyle='#d8e4ed';ctx.lineWidth=3;ctx.strokeRect(tw.x-19,tw.y-19,38,38);bar(tw.x-26,tw.y-33,52,6,tw.hp/tw.max,'#e4d39b')}
for(const u of units){if(u.dead>0||u.hp<=0)continue;const r=u.type==='champ'?19:9;circle(u.x,u.y,r,color[u.team]);if(u.type==='caster'){ctx.strokeStyle='#f8d88c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(u.x,u.y,r+4,0,Math.PI*2);ctx.stroke()}if(u.type==='melee'){ctx.strokeStyle='#c9e3f5';ctx.lineWidth=3;ctx.strokeRect(u.x-9,u.y-9,18,18)}if(u.type==='champ'){ctx.strokeStyle='#fce5a4';ctx.lineWidth=3;ctx.beginPath();ctx.arc(u.x,u.y,r+2,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#101e2c';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(String(u.level),u.x,u.y+5);bar(u.x-24,u.y-35,48,6,u.hp/u.max,'#8ce6a7')}}
for(const e of shots){ctx.globalAlpha=e.life/.25;circle(e.x,e.y,13,e.team?'#ffdfd0':'#d2edff');ctx.globalAlpha=1}ctx.restore();
score.textContent='🔵 '+Math.ceil(cores[0].hp/cores[0].max*100)+'% · '+String(Math.floor(time/60)).padStart(2,'0')+':'+String(Math.floor(time%60)).padStart(2,'0')+' · 🔴 '+Math.ceil(cores[1].hp/cores[1].max*100)+'%';
}
function resize(){const rect=canvas.getBoundingClientRect();viewW=Math.max(1,rect.width);viewH=Math.max(1,rect.height);const scale=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(viewW*scale);canvas.height=Math.round(viewH*scale);ctx.setTransform(scale,0,0,scale,0,0);bounds()}
const touches=new Map();let pinch=0;
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,point(e));pinch=0});
canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;const old=touches.get(e.pointerId),p=point(e);if(touches.size===1){camera.x-=(p.x-old.x)/camera.z;camera.y-=(p.y-old.y)/camera.z}else if(touches.size===2){const values=[...touches.entries()];const other=values.find(v=>v[0]!==e.pointerId)[1];const before=Math.hypot(old.x-other.x,old.y-other.y);const after=Math.hypot(p.x-other.x,p.y-other.y);if(before>10)camera.z=clamp(camera.z*after/before,.3,2.2)}touches.set(e.pointerId,p);bounds()});
function end(e){touches.delete(e.pointerId);pinch=0}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('wheel',e=>{e.preventDefault();camera.z=clamp(camera.z*(e.deltaY>0?.9:1.1),.3,2.2);bounds()},{passive:false});
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){let remain=dt*speed;while(remain>0){const step=Math.min(.035,remain);tick(step);remain-=step}}draw();requestAnimationFrame(frame)}
document.getElementById('mode').addEventListener('change',setup);document.getElementById('reset').onclick=setup;document.getElementById('home').onclick=center;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶ Weiter':'⏸ Pause'};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);document.querySelectorAll('[data-speed]').forEach(v=>v.classList.toggle('active',v===b))});window.addEventListener('resize',resize);resize();setup();requestAnimationFrame(frame);
</script></body></html>
