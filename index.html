<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Champion Arena</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1725;color:#e9effa;font:14px system-ui}header{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0}#hud{display:flex;justify-content:space-around;padding:8px;background:#18283b}canvas{display:block;width:100%;height:auto;touch-action:none;background:#253d36}#controls{display:flex;gap:7px;flex-wrap:wrap;padding:12px}button{border:1px solid #486582;background:#203954;color:white;padding:11px 13px;border-radius:10px;font-size:14px}button.active{background:#3678b8}#log{padding:0 12px 15px;color:#a8bfd2}small{color:#a8bfd2}</style></head><body><header><h1>⚔️ Champion Arena</h1><small>iPhone-Prototyp V0.1</small></header><div id="hud"><span id="blue">🔵 Kern 100%</span><span id="time">00:00</span><span id="red">🔴 Kern 100%</span></div><canvas id="game" width="420" height="560"></canvas><div id="controls"><button id="pause">⏸ Pause</button><button data-speed=".5">0,5×</button><button class="active" data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button><button data-speed="8">8×</button><button id="reset">↻ Neustart</button></div><div id="log">Beobachte den automatischen Kampf. Türme greifen Minions zuerst an; Champion-Angriffe unter dem Turm ziehen Turm-Aggro.</div><script>
const c=document.getElementById('game'),g=c.getContext('2d'),W=c.width,H=c.height;
let speed=1,paused=false,t=0,units=[],effects=[],winner=null,spawnTimer=0;
const bases=[{x:210,y:520,hp:100,team:0},{x:210,y:40,hp:100,team:1}];
let towers=[];
const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function setup(){t=0;spawnTimer=0;units=[];effects=[];winner=null;bases[0].hp=bases[1].hp=100;towers=[{x:145,y:445,hp:130,team:0,cd:0,aggro:null},{x:275,y:445,hp:130,team:0,cd:0,aggro:null},{x:145,y:115,hp:130,team:1,cd:0,aggro:null},{x:275,y:115,hp:130,team:1,cd:0,aggro:null}];for(let team=0;team<2;team++)units.push(makeUnit(team,'champ',210,team?83:477));}
function makeUnit(team,type,x,y){return {team,type,x,y,hp:type==='champ'?140:35,max:type==='champ'?140:35,atk:type==='champ'?13:5,range:type==='champ'?55:24,cd:rnd(0,.7),level:1,xp:0,gold:0,items:0,dead:0,kills:0};}
function gain(u,xp,gold){if(u.type!=='champ')return;u.xp+=xp;u.gold+=gold;while(u.level<18&&u.xp>=u.level*30){u.xp-=u.level*30;u.level++;u.max+=14;u.hp+=14;u.atk+=2;}if(u.gold>=100){u.gold-=100;u.items++;u.atk+=4;u.max+=15;u.hp+=15;}}
function attack(a,b,damage){b.hp-=damage;effects.push({x:b.x,y:b.y,life:.24,team:a.team});if(b.type==='champ'&&a.type==='champ'&&a.team!==b.team){for(const tw of towers)if(tw.team===b.team&&tw.hp>0&&dist(tw,a)<105)tw.aggro=a;}if(b.hp<=0){if(b.type==='champ'){b.dead=5+b.level*2;b.hp=0;gain(a,40,70);a.kills++;}else {gain(a,12,18);}}}
function tick(dt){if(winner!==null)return;t+=dt;spawnTimer-=dt;if(spawnTimer<=0){spawnTimer=5;for(let team=0;team<2;team++)for(let i=0;i<3;i++)units.push(makeUnit(team,'minion',185+i*25,team?67:493));}
for(const u of units){if(u.type==='champ'&&u.dead>0){u.dead-=dt;if(u.dead<=0){u.hp=u.max;u.x=210;u.y=u.team?83:477;}continue;}if(u.hp<=0)continue;u.cd-=dt;let enemies=units.filter(v=>v.team!==u.team&&v.hp>0&&v.dead<=0);let target=enemies.sort((a,b)=>dist(u,a)-dist(u,b))[0];const enemyTowers=towers.filter(q=>q.team!==u.team&&q.hp>0);let objective=enemyTowers.sort((a,b)=>dist(u,a)-dist(u,b))[0]||bases[1-u.team];if(target&&dist(u,target)<u.range+20)objective=target;const d=dist(u,objective);if(d>u.range){const step=Math.min(d-u.range,(u.type==='champ'?38:24)*dt);u.x+=(objective.x-u.x)/d*step;u.y+=(objective.y-u.y)/d*step;}else if(u.cd<=0){u.cd=u.type==='champ'?.85:1.35;if(objective.hp>0)attack(u,objective,u.atk);}}
for(const tw of towers){if(tw.hp<=0)continue;tw.cd-=dt;if(tw.cd>0)continue;let candidates=units.filter(u=>u.team!==tw.team&&u.hp>0&&u.dead<=0&&dist(u,tw)<105);let target=tw.aggro&&candidates.includes(tw.aggro)?tw.aggro:null;if(!target)target=candidates.filter(u=>u.type==='minion').sort((a,b)=>dist(a,tw)-dist(b,tw))[0]||candidates[0];if(target){tw.cd=1.1;attack({team:tw.team,type:'tower'},target,20);}}
units=units.filter(u=>u.type==='champ'||u.hp>0);for(const e of effects)e.life-=dt;effects=effects.filter(e=>e.life>0);
for(let team=0;team<2;team++)if(bases[team].hp<=0)winner=1-team;
}
function bar(x,y,w,h,p,col){g.fillStyle='#12212a';g.fillRect(x,y,w,h);g.fillStyle=col;g.fillRect(x,y,w*Math.max(0,p),h)}
function draw(){g.clearRect(0,0,W,H);g.fillStyle='#263e35';g.fillRect(0,0,W,H);g.fillStyle='#5e6554';g.fillRect(124,0,172,H);g.fillStyle='#6b725d';g.fillRect(131,0,158,H);g.strokeStyle='#819080';g.setLineDash([8,10]);g.beginPath();g.moveTo(210,0);g.lineTo(210,H);g.stroke();g.setLineDash([]);g.fillStyle='#324c43';g.fillRect(0,260,W,40);
for(const b of bases){g.fillStyle=b.team?'#ba5559':'#4599df';g.beginPath();g.moveTo(b.x,b.y-22);g.lineTo(b.x+24,b.y);g.lineTo(b.x,b.y+22);g.lineTo(b.x-24,b.y);g.closePath();g.fill();bar(b.x-32,b.y+26,64,6,b.hp/100,b.team?'#ef7777':'#75bbff');}
for(const tw of towers){g.fillStyle=tw.hp>0?(tw.team?'#a84b52':'#3676ac'):'#414141';g.fillRect(tw.x-13,tw.y-13,26,26);g.strokeStyle='#ddd';g.strokeRect(tw.x-13,tw.y-13,26,26);bar(tw.x-18,tw.y-22,36,4,tw.hp/130,'#e3d89a');}
for(const u of units){if(u.dead>0||u.hp<=0)continue;g.fillStyle=u.team?'#ef6e68':'#65b5fa';g.beginPath();g.arc(u.x,u.y,u.type==='champ'?13:6,0,Math.PI*2);g.fill();if(u.type==='champ'){g.strokeStyle='#f4e6ae';g.lineWidth=2;g.stroke();g.fillStyle='white';g.font='bold 10px system-ui';g.textAlign='center';g.fillText(u.level,u.x,u.y+3);bar(u.x-17,u.y-24,34,4,u.hp/u.max,'#7ce39c');g.fillStyle='#fff';g.font='10px system-ui';g.fillText('🪙'+u.gold+'  ⚔'+u.items,u.x,u.y-31);}}
for(const e of effects){g.fillStyle=e.team?'#ffb0a0':'#9fd5ff';g.globalAlpha=e.life/.24;g.beginPath();g.arc(e.x,e.y,9,0,Math.PI*2);g.fill();g.globalAlpha=1;}
if(winner!==null){g.fillStyle='#101827dc';g.fillRect(20,230,380,95);g.fillStyle='white';g.font='bold 25px system-ui';g.textAlign='center';g.fillText((winner?'ROT':'BLAU')+' GEWINNT!',210,282);}
document.getElementById('blue').textContent='🔵 Kern '+Math.max(0,Math.ceil(bases[0].hp))+'%';document.getElementById('red').textContent='🔴 Kern '+Math.max(0,Math.ceil(bases[1].hp))+'%';document.getElementById('time').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');}
let last=performance.now();function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){let remaining=dt*speed;while(remaining>0){let step=Math.min(.04,remaining);tick(step);remaining-=step;}}draw();requestAnimationFrame(frame);}
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);document.querySelectorAll('[data-speed]').forEach(v=>v.classList.toggle('active',v===b));});document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶ Weiter':'⏸ Pause';};document.getElementById('reset').onclick=setup;setup();requestAnimationFrame(frame);
</script></body></html>
